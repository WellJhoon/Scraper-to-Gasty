name: scrape-prices-batch

on:
  schedule:
    # Corre todos los días a las 08:00 UTC (04:00 AM hora Santo Domingo / RD)
    - cron: "0 8 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scrape-prices-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: pnpm exec puppeteer browsers install chrome

      - name: Setup .env file
        env:
          DOTENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$DOTENV_CONTENT" ]; then
            echo "$DOTENV_CONTENT" > .env
            echo "✅ .env creado exitosamente desde secret ENV_FILE"
          fi

      - name: Run prices batch scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_MAX_CONNECTIONS: ${{ secrets.POSTGRES_MAX_CONNECTIONS }}
          REVALIDATE_BASE_URL: ${{ secrets.REVALIDATE_BASE_URL }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          MERCA_JUMBO_API_URL: ${{ secrets.MERCA_JUMBO_API_URL }}
          MERCA_JUMBO_STORE_CODE: ${{ secrets.MERCA_JUMBO_STORE_CODE }}
          SIRENA_PRODUCT_API_URL_TEMPLATE: ${{ secrets.SIRENA_PRODUCT_API_URL_TEMPLATE }}
          SIRENA_PRODUCTS_SEARCH_API_URL: ${{ secrets.SIRENA_PRODUCTS_SEARCH_API_URL }}
          SIRENA_CATEGORY_TREE_API_URL_TEMPLATE: ${{ secrets.SIRENA_CATEGORY_TREE_API_URL_TEMPLATE }}
          NACIONAL_REST_API_URL: ${{ secrets.NACIONAL_REST_API_URL }}
          PLAZA_LAMA_GRAPHQL_URL: ${{ secrets.PLAZA_LAMA_GRAPHQL_URL }}
          PLAZA_LAMA_DPL_API_KEY: ${{ secrets.PLAZA_LAMA_DPL_API_KEY }}
          BRAVO_AUTH_TOKEN: ${{ secrets.BRAVO_AUTH_TOKEN }}
          PRICESMART_PRODUCT_API_URL: ${{ secrets.PRICESMART_PRODUCT_API_URL }}
          PRICESMART_DISCOVERY_API_URL: ${{ secrets.PRICESMART_DISCOVERY_API_URL }}
          PRICESMART_AUTH_KEY: ${{ secrets.PRICESMART_AUTH_KEY }}
          CARREFOUR_TYPESENSE_API_KEY: ${{ secrets.CARREFOUR_TYPESENSE_API_KEY }}
          CARREFOUR_PLAZA_DUARTE_COLLECTION_ID: ${{ secrets.CARREFOUR_PLAZA_DUARTE_COLLECTION_ID }}
        run: |
          pnpm scrape:prices-batch \
            --iterations 80 \
            --urls-per-shop 5 \
            --delay-min 600 \
            --delay-max 1200

      - name: Prune old price history (> 7 days)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:prune

